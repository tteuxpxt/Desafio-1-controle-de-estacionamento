<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Reserva</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/model/Vaga.js" defer></script>
    <script src="../js/controller/VagaController.js" defer></script>
    <script src="../js/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Controle de Estacionamento</h1>

      <nav>
        <a href="index.html">Início</a>
        <a href="vagas.html">Vagas cadastradas</a>
        <a href="cadastro.html">Nova reserva</a>
      </nav>
    </header>

    <main>
      <h2>Cadastro de Reserva</h2>
      <p>Preencha os dados para realizar uma reserva de vaga.</p>

      <form id="cadastroForm">
        <label for="placa">Placa do veículo:</label>
        <input type="text" id="placa" name="placa" required />

        <label for="proprietario">Nome do proprietário:</label>
        <input type="text" id="proprietario" name="proprietario" required />

        <label for="apartamento">Número do apartamento:</label>
        <input type="number" id="apartamento" name="apartamento" min="1" required />

        <label for="bloco">Bloco do apartamento:</label>
        <input type="text" id="bloco" name="bloco" required />

        <label for="modelo">Modelo do veículo:</label>
        <input type="text" id="modelo" name="modelo" required />

        <label for="cor">Cor do veículo:</label>
        <input type="text" id="cor" name="cor" required />

        <label for="vaga">Número da vaga:</label>
        <input type="number" id="vaga" name="vaga" required />

        <button type="submit">Salvar Reserva</button>
      </form>
    </main>
  </body>
</html>
